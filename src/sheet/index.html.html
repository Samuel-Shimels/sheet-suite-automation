<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SME Login</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-lg rounded-3xl p-10 max-w-md w-full">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">SME Dashboard Login</h2>
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="form-label text-gray-700">Email</label>
        <input type="email" id="email" placeholder="your@email.com" class="form-control rounded-xl p-3" required>
      </div>
      <div>
        <label class="form-label text-gray-700">Password</label>
        <input type="password" id="password" placeholder="••••••••" class="form-control rounded-xl p-3" required>
      </div>
      <button type="submit" class="btn btn-primary w-full py-3 rounded-xl mt-3">Login</button>
    </form>
    <p id="loginMsg" class="text-center text-red-500 mt-4"></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      google.script.run.withSuccessHandler((res) => {
        if(res.success){
          loginMsg.classList.remove('text-red-500');
          loginMsg.classList.add('text-green-500');
          loginMsg.innerText = res.message;
          // Optionally redirect to dashboard page
        } else {
          loginMsg.classList.remove('text-green-500');
          loginMsg.classList.add('text-red-500');
          loginMsg.innerText = res.message;
        }
      }).loginUser(email, password);
    });
  </script>
</body>
</html>
